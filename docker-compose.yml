services:
  postgres:
    image: postgres:18-alpine
    container_name: resourcehub-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-resourcehub}
      POSTGRES_USER: ${POSTGRES_USER:-resourcehub_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-resourcehub_pass}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-resourcehub_user} -d ${POSTGRES_DB:-resourcehub}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
