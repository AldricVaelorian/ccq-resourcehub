spring:
  application:
    name: ResourceHub Backend
  profiles:
    active: dev
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  main:
    banner-mode: console

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /
  error:
    include-message: always
    include-binding-errors: always

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true

logging:
  level:
    root: INFO
    de.ccq.resourcehub: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

# Database configuration (can be overridden by environment variables)
spring.datasource:
  url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/resourcehub}
  username: ${SPRING_DATASOURCE_USERNAME:resourcehub_user}
  password: ${SPRING_DATASOURCE_PASSWORD:resourcehub_pass}
  driver-class-name: org.postgresql.Driver

# Flyway configuration for database migrations
spring.flyway:
  enabled: ${FLYWAY_ENABLED:true}
  baseline-on-migrate: ${FLYWAY_BASELINE_ON_MIGRATE:true}
  baseline-version: 0
  locations: classpath:db/migration
  table: flyway_schema_history
  validate-on-migrate: ${FLYWAY_VALIDATE_ON_MIGRATE:true}
  mixed: ${FLYWAY_MIXED:false}