spring:
  application:
    name: ResourceHub Backend
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  main:
    banner-mode: console

  # Override datasource for test profile (Testcontainers will set these)
  datasource:
    url: jdbc:postgresql://localhost:${DATABASE_PORT:5432}/${DATABASE_NAME:test_resourcehub}
    username: ${DATABASE_USER:resourcehub_user}
    password: ${DATABASE_PASS:resourcehub_pass}
    driver-class-name: org.postgresql.Driver

server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true

logging:
  level:
    root: WARN
    de.ccq.resourcehub: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
