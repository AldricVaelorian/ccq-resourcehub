name: CI/CD

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  JAVA_VERSION: "25"
  REGISTRY: ghcr.io

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Run tests
        run: ./backend/mvnw test

      - name: Upload test artifacts
        uses: actions/upload-artifact@v6
        with:
          name: test-target
          path: target/
          if-no-files-found: error

      - name: Upload JaCoCo coverage report
        uses: actions/upload-artifact@v6
        with:
          name: jacoco-coverage
          path: target/site/jacoco/jacoco.xml
          if-no-files-found: warn

  quality:
    name: Quality checks
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Run Maven verification
        run: ./backend/mvnw verify -DskipTests

  mutation-testing:
    name: Mutation testing
    runs-on: ubuntu-latest
    needs: test
    continue-on-error: true
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Run PIT mutation tests
        run: ./backend/mvnw pitest:mutationCoverage

      - name: Upload PIT mutation report
        uses: actions/upload-artifact@v6
        with:
          name: pit-mutation-report
          path: target/pit-reports/
          if-no-files-found: warn

  sast:
    name: CodeQL SAST
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
          build-mode: manual

      - name: Build for CodeQL
        run: ./backend/mvnw package -DskipTests

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
