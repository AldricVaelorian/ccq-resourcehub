name: CI/CD

on:
  push:
    branches: [main, feature/**]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  JAVA_VERSION: "25"
  REGISTRY: ghcr.io

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Verify project structure
        run: |
          echo "Working directory: $(pwd)"
          echo "Contents of backend directory:"
          ls -la

      - name: Build with Maven
        run: ./mvnw clean install -DskipTests

      - name: Run tests
        run: ./mvnw test

      - name: Upload test results
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: target/surefire-reports/
          if-no-files-found: warn

      - name: Upload JaCoCo coverage
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-coverage
          path: target/site/jacoco/
          if-no-files-found: warn

  quality:
    name: Quality checks
    runs-on: ubuntu-latest
    needs: test
    defaults:
      run:
        working-directory: ./backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Run Maven verification
        run: ./mvnw verify -DskipTests

  mutation-testing:
    name: Mutation testing
    runs-on: ubuntu-latest
    needs: test
    continue-on-error: true
    defaults:
      run:
        working-directory: ./backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Run PIT mutation tests
        run: ./mvnw pitest:mutationCoverage -DskipTests

      - name: Upload PIT report
        uses: actions/upload-artifact@v7
        with:
          name: pit-mutation-report
          path: target/pit-reports/
          if-no-files-found: warn

  sast:
    name: CodeQL SAST
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: java
          build-mode: auto

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
